name: Snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cobrinha.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar a cobra
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0891B2&color_dots=#EBEDF0,#A5F3FC,#22D3EE,#0891B2,#155E75
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#161B22,#155E75,#0E7490,#06B6D4,#67E8F9

      - name: Publicar na branch output
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish="$RUNNER_TEMP/snake"
          mkdir -p "$publish"
          cp dist/*.svg "$publish/"
          cd "$publish"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: atualiza a cobra"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
